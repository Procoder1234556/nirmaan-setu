services:
  - type: web
    name: nirmaan-setu
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nirmaan-setu-db
          property: connectionString
      - key: NODE_ENV
        value: production
databases:
  - name: nirmaan-setu-db
    plan: basic-256mb
    databaseName: nirmaan_setu
    user: nirmaan_setu
